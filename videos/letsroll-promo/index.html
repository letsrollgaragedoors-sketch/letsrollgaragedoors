<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #FFFFFF;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-qv3y" id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">
      <div data-hf-id="hf-9upt" id="el-01-hook" class="scene" data-composition-id="01-hook" data-composition-src="compositions/frames/01-hook.html" data-start="0" data-duration="3" data-track-index="0"></div>

      <div data-hf-id="hf-b8t2" id="el-02-springs-cables" class="scene" data-composition-id="02-springs-cables" data-composition-src="compositions/frames/02-springs-cables.html" data-start="3" data-duration="3" data-track-index="1"></div>

      <div data-hf-id="hf-9r66" id="el-03-openers-panels" class="scene" data-composition-id="03-openers-panels" data-composition-src="compositions/frames/03-openers-panels.html" data-start="6" data-duration="3" data-track-index="0"></div>

      <div data-hf-id="hf-litm" id="el-04-new-doors" class="scene" data-composition-id="04-new-doors" data-composition-src="compositions/frames/04-new-doors.html" data-start="9" data-duration="3.5" data-track-index="1"></div>

      <div data-hf-id="hf-37y9" id="el-05-cta" class="scene" data-composition-id="05-cta" data-composition-src="compositions/frames/05-cta.html" data-start="12" data-duration="3" data-track-index="0"></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-04-new-doors", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 12);
        tl.fromTo("#el-05-cta", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 12);
        tl.to({}, { duration: 15 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
