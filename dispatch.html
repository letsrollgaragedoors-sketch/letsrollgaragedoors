<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Let's Roll Dispatch</title>

<!-- iPhone home-screen app settings -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dispatch">
<meta name="theme-color" content="#16202B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Crect width='26' height='26' rx='5' fill='%2316202B'/%3E%3Crect x='4' y='6' width='18' height='15' rx='1.5' fill='none' stroke='%23E8641B' stroke-width='2'/%3E%3Cline x1='4' y1='11' x2='22' y2='11' stroke='%23E8641B' stroke-width='2'/%3E%3Cline x1='4' y1='16' x2='22' y2='16' stroke='%23E8641B' stroke-width='2'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Crect width='26' height='26' fill='%2316202B'/%3E%3Crect x='4' y='6' width='18' height='15' rx='1.5' fill='none' stroke='%23E8641B' stroke-width='2'/%3E%3Cline x1='4' y1='11' x2='22' y2='11' stroke='%23E8641B' stroke-width='2'/%3E%3Cline x1='4' y1='16' x2='22' y2='16' stroke='%23E8641B' stroke-width='2'/%3E%3C/svg%3E">

<style>
  :root {
    --bg:#F2F3F1; --panel:#fff; --ink:#16202B; --mid:#5A6675; --line:#DCDFDC;
    --accent:#E8641B; --accent-soft:#FBEDE3;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; padding:0; }
  body {
    background:var(--bg); color:var(--ink);
    font-family:'Barlow', system-ui, -apple-system, sans-serif;
    padding-bottom:env(safe-area-inset-bottom);
  }
  button { cursor:pointer; font-family:inherit; }
  input, select, textarea { font-family:inherit; font-size:16px; } /* 16px stops iOS zoom */
  input:focus, select:focus, textarea:focus, button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  ::placeholder { color:#9AA3AC; }

  header { background:var(--ink); color:#fff; padding-top:env(safe-area-inset-top); }
  .topbar { display:flex; align-items:center; gap:12px; padding:10px 14px; flex-wrap:wrap; }
  .brand { display:flex; align-items:center; gap:9px; }
  .brand-name { font-family:'Barlow Condensed','Arial Narrow',sans-serif; font-weight:700; font-size:21px; letter-spacing:.3px; white-space:nowrap; }
  .brand-name span { color:var(--accent); }
  .top-actions { margin-left:auto; display:flex; gap:8px; }

  .btn-solid { background:var(--accent); color:#fff; border:none; border-radius:5px; padding:10px 15px; font-weight:600; font-size:14px; }
  .btn-ghost { background:transparent; color:#C7CDD3; border:1px solid #3A4552; border-radius:5px; padding:10px 14px; font-weight:600; font-size:14px; }
  .btn-nav   { background:#fff; border:1px solid var(--line); border-radius:5px; padding:9px 13px; font-weight:600; font-size:13.5px; color:var(--ink); }
  .btn-link  { background:none; border:none; padding:0; font-size:13.5px; font-weight:600; color:var(--mid); text-decoration:underline; text-underline-offset:3px; }
  .btn-link.danger { color:#9A5A5A; }

  nav.tabs { display:flex; gap:2px; padding:0 12px 10px; }
  nav.tabs button {
    flex:1 1 0; max-width:140px; background:#222E3B; color:#C7CDD3;
    border:none; border-radius:5px; padding:10px 8px; font-weight:600; font-size:14px;
  }
  nav.tabs button.active { background:var(--accent); color:#fff; }

  .stats { display:flex; gap:1px; background:var(--line); border-bottom:1px solid var(--line); }
  .stat { flex:1 1 0; background:#fff; padding:10px 16px; min-width:0; }
  .stat .v { font-family:'Barlow Condensed','Arial Narrow',sans-serif; font-size:21px; font-weight:700; line-height:1.1; }
  .stat .l { font-size:12px; color:var(--mid); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  main { padding:16px 14px 40px; max-width:1100px; margin:0 auto; }
  h2 { font-family:'Barlow Condensed','Arial Narrow',sans-serif; font-size:23px; font-weight:700; margin:0; }
  h3 { font-family:'Barlow Condensed','Arial Narrow',sans-serif; font-size:18px; font-weight:700; margin:0; }
  .toolrow { display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
  .search { width:260px; margin-left:auto; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:6px; }
  .input { width:100%; padding:11px; border:1px solid var(--line); border-radius:5px; background:#fff; }
  label.f { display:block; font-size:13px; font-weight:600; color:var(--mid); margin-bottom:5px; }
  .field { margin-bottom:12px; }

  .daygrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; }
  .daycol { overflow:hidden; border-top:3px solid transparent; }
  .daycol.today { border-top-color:var(--accent); }
  .dayhead { padding:8px 10px; border-bottom:1px solid var(--line); font-weight:700; font-size:13px; }
  .daycol.today .dayhead { color:var(--accent); }
  .daybody { padding:8px; display:flex; flex-direction:column; gap:8px; min-height:60px; }
  .empty-day { font-size:12.5px; color:#A6ADB4; padding:4px 2px; }
  .daycol.open { opacity:.75; }
  .daycol.open .dayhead { border-bottom:none; }
  .daycol.open .openlabel { padding:0 10px 10px; font-size:12.5px; color:#A6ADB4; }

  .ticket {
    text-align:left; width:100%; background:#fff; border:1px solid var(--line);
    border-left-width:4px; border-radius:4px; padding:10px 11px; display:block;
  }
  .ticket .slot { font-size:12px; font-weight:700; }
  .ticket .who { font-weight:600; font-size:14.5px; margin:2px 0; color:var(--ink); }
  .ticket .what { font-size:12.5px; color:var(--mid); }

  .chips { display:flex; gap:5px; flex-wrap:wrap; margin-bottom:12px; }
  .chip { background:#fff; color:var(--mid); border:1px solid var(--line); border-radius:999px; padding:7px 13px; font-size:13px; font-weight:600; }
  .chip.active { background:var(--ink); color:#fff; border-color:var(--ink); }

  .jobrow { display:flex; align-items:center; gap:12px; padding:12px 14px; border-top:1px solid var(--line); flex-wrap:wrap; }
  .jobrow:first-child { border-top:none; }
  .jobrow .when { width:72px; font-size:13px; font-weight:600; color:var(--mid); }
  .jobrow .when .slot { font-weight:400; font-size:12px; }
  .jobrow .main { flex:1 1 170px; min-width:150px; }
  .jobrow .name { background:none; border:none; padding:0; font-weight:700; font-size:15px; color:var(--ink); text-align:left; text-decoration:underline; text-decoration-color:var(--line); text-underline-offset:3px; }
  .jobrow .sub { font-size:13px; color:var(--mid); }
  .jobrow select { border:1px solid var(--line); border-radius:5px; padding:8px; font-weight:700; font-size:14px; }

  .custgrid { display:grid; grid-template-columns:minmax(220px,1fr) 2fr; gap:14px; align-items:start; }
  .custgrid.single { grid-template-columns:1fr; }
  .custitem { display:block; width:100%; text-align:left; background:#fff; border:none; border-top:1px solid var(--line); border-left:4px solid transparent; padding:12px 14px; }
  .custitem:first-child { border-top:none; }
  .custitem.sel { background:var(--accent-soft); border-left-color:var(--accent); }
  .custitem .n { font-weight:700; font-size:14.5px; color:var(--ink); }
  .custitem .p { font-size:13px; color:var(--mid); }
  .notesbox { margin-top:12px; background:#FBF8F3; border:1px solid #EFE6D8; border-radius:4px; padding:9px 12px; font-size:13.5px; }
  .pill { font-size:12px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap; }

  .emptystate { padding:34px 20px; text-align:center; }
  .emptystate .t { font-family:'Barlow Condensed','Arial Narrow',sans-serif; font-size:20px; font-weight:700; }
  .emptystate .b { font-size:14px; color:var(--mid); margin:6px auto 16px; max-width:380px; }

  .overlay { position:fixed; inset:0; background:rgba(22,32,43,.5); display:flex; align-items:flex-end; justify-content:center; z-index:50; }
  .sheet { background:#fff; width:100%; max-width:540px; border-radius:12px 12px 0 0; max-height:92vh; overflow:auto; padding-bottom:env(safe-area-inset-bottom); }
  .sheet-head { display:flex; align-items:center; padding:14px 18px; border-bottom:1px solid var(--line); position:sticky; top:0; background:#fff; }
  .sheet-head .t { font-family:'Barlow Condensed','Arial Narrow',sans-serif; font-size:20px; font-weight:700; }
  .sheet-head .x { margin-left:auto; background:none; border:none; font-size:24px; color:var(--mid); line-height:1; padding:2px 6px; }
  .sheet-body { padding:18px; }
  .formgrid { display:grid; grid-template-columns:1fr 1fr; gap:0 12px; }
  .sheet-actions { display:flex; gap:8px; align-items:center; margin-top:6px; flex-wrap:wrap; }
  .sheet-actions .right { margin-left:auto; display:flex; gap:8px; }

  .banner { background:#F4E9E9; color:#9A5A5A; padding:8px 14px; font-size:13.5px; font-weight:600; }
  .footerlink { margin-top:36px; text-align:center; font-size:13.5px; color:var(--mid); }

  @media (max-width:640px) {
    .search { width:100%; margin-left:0; }
    .custgrid { grid-template-columns:1fr; }
    .formgrid { grid-template-columns:1fr; }
    .daygrid { grid-template-columns:1fr; }
    .daycol.open .dayhead { padding-bottom:2px; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ================================================================
   Let's Roll Dispatch — standalone edition
   Data is saved in this device's browser (localStorage).
   ================================================================ */

const STORE_KEY = "lrd-data-v1";

const STATUS = {
  new:        { label:"New",         color:"#8A94A0", bg:"#EEF0F2" },
  scheduled:  { label:"Scheduled",   color:"#2E6FB8", bg:"#E7EFF8" },
  inprogress: { label:"In progress", color:"#C27B0A", bg:"#FAF1DE" },
  done:       { label:"Done",        color:"#2F8A4C", bg:"#E6F2EA" },
  cancelled:  { label:"Cancelled",   color:"#9A5A5A", bg:"#F4E9E9" },
};
const STATUS_ORDER = ["new","scheduled","inprogress","done","cancelled"];
const JOB_TYPES = ["Repair","Spring replacement","Opener install","New door install","Tune-up","Estimate"];
const TIME_SLOTS = ["8–10 AM","10–12 PM","12–2 PM","2–4 PM","4–6 PM"];

/* ---------- storage (works in normal browsers; falls back to memory) ---------- */
let memFallback = null;
function loadData() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* storage unavailable */ }
  return memFallback || { customers: [], jobs: [] };
}
function saveData() {
  memFallback = { customers: state.customers, jobs: state.jobs };
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(memFallback));
    state.saveError = false;
  } catch (e) {
    state.saveError = true;
  }
}

/* ---------- date helpers ---------- */
const iso = d => {
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,"0"), dd = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${dd}`;
};
const today = () => iso(new Date());
const addDays = (s,n) => { const d = new Date(s+"T12:00:00"); d.setDate(d.getDate()+n); return iso(d); };
const startOfWeek = s => { const d = new Date(s+"T12:00:00"); const day = d.getDay(); d.setDate(d.getDate() + (day===0?-6:1-day)); return iso(d); };
const fmtDay = s => new Date(s+"T12:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
const fmtShort = s => s ? new Date(s+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"}) : "No date";
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- state ---------- */
const saved = loadData();
const state = {
  customers: Array.isArray(saved.customers) ? saved.customers : [],
  jobs: Array.isArray(saved.jobs) ? saved.jobs : [],
  view: "schedule",
  weekStart: startOfWeek(today()),
  jobFilter: "all",
  search: "",
  selectedCustomerId: null,
  saveError: false,
  confirmReset: false,
};

const custById = () => Object.fromEntries(state.customers.map(c => [c.id, c]));
const jobName = (j, map) => (map[j.customerId]?.name) || j.label || "Quick job";

/* ---------- mutations ---------- */
function saveJob(data) {
  if (data.id) {
    state.jobs = state.jobs.map(j => j.id === data.id ? {...j, ...data} : j);
  } else {
    const id = state.jobs.length ? Math.max(...state.jobs.map(j=>j.id))+1 : 101;
    state.jobs.push({...data, id});
  }
  saveData(); closeSheet(); render();
}
function deleteJob(id) {
  state.jobs = state.jobs.filter(j => j.id !== id);
  saveData(); closeSheet(); render();
}
function saveCustomer(data) {
  if (data.id) {
    state.customers = state.customers.map(c => c.id === data.id ? {...c, ...data} : c);
  } else {
    const id = state.customers.length ? Math.max(...state.customers.map(c=>c.id))+1 : 1;
    state.customers.push({...data, id});
    state.selectedCustomerId = id;
    state.view = "customers";
  }
  saveData(); closeSheet(); render();
}
function setJobStatus(id, status) {
  state.jobs = state.jobs.map(j => j.id === id ? {...j, status} : j);
  saveData(); render();
}
function resetAll() {
  state.customers = []; state.jobs = []; state.selectedCustomerId = null; state.confirmReset = false;
  try { localStorage.removeItem(STORE_KEY); } catch(e) {}
  memFallback = { customers: [], jobs: [] };
  render();
}

/* ---------- rendering ---------- */
function render() {
  const map = custById();
  document.getElementById("app").innerHTML = `
    ${header()}
    ${statStrip()}
    ${state.saveError ? `<div class="banner">Couldn't save your latest change on this device. It's still on screen — try again, and check you're not in Private Browsing.</div>` : ""}
    <main>
      ${state.view === "schedule" ? scheduleView(map) : state.view === "jobs" ? jobsView(map) : customersView(map)}
      ${footer()}
    </main>
  `;
}

function header() {
  const tab = (key,label) => `<button class="${state.view===key?"active":""}" onclick="go('${key}')">${label}</button>`;
  return `
  <header>
    <div class="topbar">
      <div class="brand">
        <svg width="24" height="24" viewBox="0 0 26 26" aria-hidden="true">
          <rect x="2" y="4" width="22" height="19" rx="1.5" fill="none" stroke="#E8641B" stroke-width="2"/>
          <line x1="2" y1="10" x2="24" y2="10" stroke="#E8641B" stroke-width="2"/>
          <line x1="2" y1="16" x2="24" y2="16" stroke="#E8641B" stroke-width="2"/>
        </svg>
        <div class="brand-name">Let's Roll <span>Dispatch</span></div>
      </div>
      <div class="top-actions">
        <button class="btn-ghost" onclick="openCustomerSheet()">+ Customer</button>
        <button class="btn-solid" onclick="openJobSheet()">+ Job</button>
      </div>
    </div>
    <nav class="tabs">
      ${tab("schedule","Schedule")}${tab("jobs","Jobs")}${tab("customers","Customers")}
    </nav>
  </header>`;
}

function statStrip() {
  const t = today();
  const todayCount = state.jobs.filter(j => j.date === t && j.status !== "cancelled").length;
  const open = state.jobs.filter(j => ["new","scheduled","inprogress"].includes(j.status)).length;
  const unsched = state.jobs.filter(j => j.status === "new" && !j.date).length;
  const rev = state.jobs.filter(j => j.status === "done" && j.date >= addDays(t,-7))
    .reduce((s,j) => s + (Number(j.amount)||0), 0);
  const item = (v,l) => `<div class="stat"><div class="v">${v}</div><div class="l">${l}</div></div>`;
  return `<div class="stats">${item(todayCount,"Today")}${item(open,"Open")}${item(unsched,"To schedule")}${item("$"+rev.toLocaleString(),"Done, 7 days")}</div>`;
}

function emptyState(t, b, label, action) {
  return `<div class="card emptystate">
    <div class="t">${t}</div><div class="b">${b}</div>
    ${action ? `<button class="btn-solid" onclick="${action}">${label}</button>` : ""}
  </div>`;
}

function ticket(j, map) {
  const s = STATUS[j.status];
  return `<button class="ticket" style="border-left-color:${s.color}" onclick="openJobSheet(${j.id})">
    <div class="slot" style="color:${s.color}">${esc(j.slot) || s.label}</div>
    <div class="who">${esc(jobName(j, map))}</div>
    <div class="what">${esc(j.type)}${j.tech ? " · "+esc(j.tech) : ""}</div>
  </button>`;
}

function scheduleView(map) {
  const t = today();
  if (state.customers.length === 0 && state.jobs.length === 0) {
    return emptyState("Your board is empty",
      "Book your first job and it'll land on the week below. You can attach a customer to it or add one later.",
      "Book first job", "openJobSheet()");
  }
  const days = Array.from({length:6},(_,i)=>addDays(state.weekStart,i));
  const cols = days.map(day => {
    const dayJobs = state.jobs
      .filter(j => j.date === day && j.status !== "cancelled")
      .sort((a,b) => TIME_SLOTS.indexOf(a.slot) - TIME_SLOTS.indexOf(b.slot));
    const isToday = day === t;
    if (!dayJobs.length && !isToday) {
      return `<div class="card daycol open"><div class="dayhead">${fmtDay(day)}</div><div class="openlabel">Open</div></div>`;
    }
    return `<div class="card daycol ${isToday?"today":""}">
      <div class="dayhead">${fmtDay(day)}${isToday?" — today":""}</div>
      <div class="daybody">
        ${dayJobs.length ? dayJobs.map(j=>ticket(j,map)).join("") : `<div class="empty-day">Nothing booked yet.</div>`}
      </div>
    </div>`;
  }).join("");

  const unscheduled = state.jobs.filter(j => !j.date && !["cancelled","done"].includes(j.status));
  return `
    <div class="toolrow">
      <h2>Week of ${fmtShort(state.weekStart)}</h2>
      <div style="display:flex;gap:6px;margin-left:auto">
        <button class="btn-nav" onclick="shiftWeek(-7)" aria-label="Previous week">‹</button>
        <button class="btn-nav" onclick="goToday()">Today</button>
        <button class="btn-nav" onclick="shiftWeek(7)" aria-label="Next week">›</button>
      </div>
    </div>
    <div class="daygrid">${cols}</div>
    ${unscheduled.length ? `
      <div style="margin-top:22px">
        <h3>Needs scheduling</h3>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px">
          ${unscheduled.map(j=>`<div style="flex:1 1 240px;max-width:320px">${ticket(j,map)}</div>`).join("")}
        </div>
      </div>` : ""}
  `;
}

function jobsView(map) {
  if (state.jobs.length === 0) {
    return emptyState("No jobs yet",
      "Book your first job and it'll appear here and on the schedule. You can attach a customer or just give it a name.",
      "Create first job", "openJobSheet()");
  }
  const chips = ["all",...STATUS_ORDER].map(s =>
    `<button class="chip ${state.jobFilter===s?"active":""}" onclick="setFilter('${s}')">${s==="all"?"All":STATUS[s].label}</button>`
  ).join("");

  const q = state.search.trim().toLowerCase();
  const rows = state.jobs
    .filter(j => state.jobFilter === "all" || j.status === state.jobFilter)
    .filter(j => {
      if (!q) return true;
      const c = map[j.customerId];
      return `${j.type} ${j.notes} ${j.tech} ${j.label||""} ${c?.name||""} ${c?.address||""}`.toLowerCase().includes(q);
    })
    .sort((a,b) => (a.date||"9999").localeCompare(b.date||"9999"))
    .map(j => {
      const opts = STATUS_ORDER.map(s => `<option value="${s}" ${j.status===s?"selected":""}>${STATUS[s].label}</option>`).join("");
      return `<div class="jobrow">
        <div class="when">${fmtShort(j.date)}${j.slot?`<div class="slot">${esc(j.slot)}</div>`:""}</div>
        <div class="main">
          <button class="name" onclick="openJobSheet(${j.id})">${esc(jobName(j,map))}</button>
          <div class="sub">${esc(j.type)}${j.tech?" · "+esc(j.tech):""}${j.amount?" · $"+Number(j.amount).toLocaleString():""}</div>
        </div>
        <select aria-label="Job status" style="background:${STATUS[j.status].bg};color:${STATUS[j.status].color}" onchange="setJobStatus(${j.id}, this.value)">${opts}</select>
      </div>`;
    }).join("");

  return `
    <div class="toolrow">
      <h2>Jobs</h2>
      <input class="input search" placeholder="Search jobs, customers, addresses…" value="${esc(state.search)}" oninput="setSearch(this.value)">
    </div>
    <div class="chips">${chips}</div>
    <div class="card">${rows || `<div style="padding:22px;color:var(--mid);font-size:14px">No jobs match this filter or search.</div>`}</div>
  `;
}

function customersView(map) {
  if (state.customers.length === 0) {
    return emptyState("No customers yet",
      "Add your first customer with their phone, address, and any site notes like gate codes.",
      "Add first customer", "openCustomerSheet()");
  }
  const q = state.search.trim().toLowerCase();
  const list = state.customers.filter(c =>
    !q || `${c.name} ${c.phone} ${c.address} ${c.email}`.toLowerCase().includes(q)
  );
  const sel = state.customers.find(c => c.id === state.selectedCustomerId) || null;

  const listHtml = list.map(c => `
    <button class="custitem ${sel && c.id===sel.id ? "sel":""}" onclick="selectCustomer(${c.id})">
      <div class="n">${esc(c.name)}</div><div class="p">${esc(c.phone)}</div>
    </button>`).join("") || `<div style="padding:18px;color:var(--mid);font-size:14px">No customers match your search.</div>`;

  let detail = "";
  if (sel) {
    const cj = state.jobs.filter(j => j.customerId === sel.id).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const lifetime = cj.filter(j=>j.status==="done").reduce((s,j)=>s+(Number(j.amount)||0),0);
    const hist = cj.map(j => `
      <button class="ticket" style="border-left-color:${STATUS[j.status].color};display:flex;align-items:center;gap:10px;flex-wrap:wrap" onclick="openJobSheet(${j.id})">
        <div style="width:66px;font-size:13px;color:var(--mid)">${fmtShort(j.date)}</div>
        <div style="flex:1;font-weight:600;font-size:14px;min-width:110px;color:var(--ink)">${esc(j.type)}</div>
        <div style="font-size:13.5px;font-weight:600">${j.amount?"$"+Number(j.amount).toLocaleString():""}</div>
        <span class="pill" style="background:${STATUS[j.status].bg};color:${STATUS[j.status].color}">${STATUS[j.status].label}</span>
      </button>`).join("");
    const tel = (sel.phone||"").replace(/[^\d+]/g,"");
    detail = `<div class="card" style="padding:16px">
      <div style="display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap">
        <div style="min-width:0">
          <div style="font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:21px;font-weight:700">${esc(sel.name)}</div>
          ${sel.phone?`<a href="tel:${tel}" style="font-size:14.5px;color:var(--accent);font-weight:600;text-decoration:none">${esc(sel.phone)}</a>`:""}
          ${sel.email?`<div style="font-size:13.5px;color:var(--mid)">${esc(sel.email)}</div>`:""}
          ${sel.address?`<div style="font-size:13.5px;color:var(--mid)">${esc(sel.address)}</div>`:""}
        </div>
        <div style="margin-left:auto;display:flex;gap:8px">
          <button class="btn-nav" onclick="openCustomerSheet(${sel.id})">Edit</button>
          <button class="btn-solid" onclick="openJobSheet(null, ${sel.id})">+ Job</button>
        </div>
      </div>
      ${sel.notes?`<div class="notesbox">${esc(sel.notes)}</div>`:""}
      <div style="display:flex;gap:18px;margin-top:14px;font-size:14px">
        <div><strong>${cj.length}</strong> <span style="color:var(--mid)">jobs</span></div>
        <div><strong>$${lifetime.toLocaleString()}</strong> <span style="color:var(--mid)">lifetime (done)</span></div>
      </div>
      <div style="margin-top:16px">
        <div style="font-weight:700;font-size:14px;margin-bottom:8px">Job history</div>
        ${hist || `<div style="font-size:13.5px;color:var(--mid)">No jobs yet — book the first one.</div>`}
        <div style="display:flex;flex-direction:column;gap:8px"></div>
      </div>
    </div>`;
  }

  return `
    <div class="toolrow">
      <h2>Customers</h2>
      <input class="input search" placeholder="Search name, phone, address…" value="${esc(state.search)}" oninput="setSearch(this.value)">
    </div>
    <div class="custgrid ${sel?"":"single"}">
      <div class="card" style="overflow:hidden">${listHtml}</div>
      ${detail}
    </div>
  `;
}

function footer() {
  const backupLinks = `
    <button class="btn-link" onclick="exportData()">Export backup</button> ·
    <button class="btn-link" onclick="document.getElementById('import-file').click()">Restore backup</button>
    <input id="import-file" type="file" accept=".json,application/json" style="display:none" onchange="importData(this)">`;
  if (!state.customers.length && !state.jobs.length) {
    return `<div class="footerlink">${backupLinks}</div>`;
  }
  if (state.confirmReset) {
    return `<div class="footerlink">Delete all customers and jobs?
      <button class="btn-link danger" onclick="resetAll()">Yes, erase everything</button> ·
      <button class="btn-link" onclick="state.confirmReset=false;render()">Keep my data</button>
    </div>`;
  }
  return `<div class="footerlink">${backupLinks} ·
    <button class="btn-link" style="color:#A6ADB4" onclick="state.confirmReset=true;render()">Reset all data</button>
  </div>`;
}

/* ---------- backup: export & restore ---------- */
function exportData() {
  const payload = {
    app: "lets-roll-dispatch",
    exportedAt: new Date().toISOString(),
    customers: state.customers,
    jobs: state.jobs,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `lets-roll-backup-${today()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

function importData(input) {
  const file = input.files && input.files[0];
  input.value = ""; // allow re-picking the same file later
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      const customers = Array.isArray(data.customers) ? data.customers : null;
      const jobs = Array.isArray(data.jobs) ? data.jobs : null;
      if (!customers || !jobs) {
        alert("That file doesn't look like a Let's Roll backup.");
        return;
      }
      const summary = `${customers.length} customer${customers.length===1?"":"s"} and ${jobs.length} job${jobs.length===1?"":"s"}`;
      const hasData = state.customers.length || state.jobs.length;
      const msg = hasData
        ? `Restore ${summary} from this backup? This replaces everything currently on this device.`
        : `Restore ${summary} from this backup?`;
      if (!confirm(msg)) return;
      state.customers = customers;
      state.jobs = jobs;
      state.selectedCustomerId = null;
      saveData();
      render();
    } catch (e) {
      alert("Couldn't read that file — make sure it's a backup exported from this app.");
    }
  };
  reader.readAsText(file);
}

/* ---------- sheets (modals) ---------- */
function closeSheet() {
  const el = document.getElementById("sheet");
  if (el) el.remove();
}
function sheet(title, bodyHtml) {
  closeSheet();
  const wrap = document.createElement("div");
  wrap.id = "sheet";
  wrap.innerHTML = `
    <div class="overlay" onclick="if(event.target===this)closeSheet()">
      <div class="sheet">
        <div class="sheet-head"><div class="t">${title}</div><button class="x" aria-label="Close" onclick="closeSheet()">×</button></div>
        <div class="sheet-body">${bodyHtml}</div>
      </div>
    </div>`;
  document.body.appendChild(wrap);
}

function openJobSheet(jobId = null, presetCustomerId = null) {
  const j = jobId ? state.jobs.find(x => x.id === jobId) : null;
  const custOpts = state.customers.map(c =>
    `<option value="${c.id}" ${ (j?.customerId ?? presetCustomerId) === c.id ? "selected":"" }>${esc(c.name)}</option>`).join("");
  const typeOpts = JOB_TYPES.map(t => `<option ${j?.type===t?"selected":""}>${t}</option>`).join("");
  const statusOpts = STATUS_ORDER.map(s => `<option value="${s}" ${ (j?.status||"new")===s?"selected":"" }>${STATUS[s].label}</option>`).join("");
  const slotOpts = `<option value="">No time set</option>` + TIME_SLOTS.map(t => `<option ${j?.slot===t?"selected":""}>${t}</option>`).join("");
  const noCust = !(j?.customerId ?? presetCustomerId);

  sheet(j ? "Edit job" : "New job", `
    <div class="field"><label class="f">Customer (optional)</label>
      <select id="jf-cust" class="input" onchange="document.getElementById('jf-labelwrap').style.display = this.value ? 'none' : 'block'">
        <option value="">No customer — quick job</option>${custOpts}
      </select>
    </div>
    <div class="field" id="jf-labelwrap" style="display:${noCust?"block":"none"}">
      <label class="f">Job name</label>
      <input id="jf-label" class="input" placeholder="e.g. Walk-in spring repair, Cedar Park" value="${esc(j?.label||"")}">
    </div>
    <div class="formgrid">
      <div class="field"><label class="f">Job type</label><select id="jf-type" class="input">${typeOpts}</select></div>
      <div class="field"><label class="f">Status</label><select id="jf-status" class="input">${statusOpts}</select></div>
      <div class="field"><label class="f">Date</label><input id="jf-date" type="date" class="input" value="${j?.date||""}"></div>
      <div class="field"><label class="f">Time window</label><select id="jf-slot" class="input">${slotOpts}</select></div>
      <div class="field"><label class="f">Technician</label><input id="jf-tech" class="input" placeholder="Who's on it" value="${esc(j?.tech||"")}"></div>
      <div class="field"><label class="f">Amount ($)</label><input id="jf-amount" type="number" inputmode="decimal" class="input" placeholder="0" value="${j?.amount||""}"></div>
    </div>
    <div class="field"><label class="f">Notes</label>
      <textarea id="jf-notes" class="input" rows="3" placeholder="Door size, parts needed, gate codes…">${esc(j?.notes||"")}</textarea>
    </div>
    <div class="sheet-actions">
      ${j ? `<button class="btn-link danger" onclick="if(confirm('Delete this job?'))deleteJob(${j.id})">Delete</button>` : ""}
      <div class="right">
        <button class="btn-nav" onclick="closeSheet()">Cancel</button>
        <button class="btn-solid" onclick="submitJob(${j?.id ?? "null"})">${j ? "Save changes" : "Create job"}</button>
      </div>
    </div>
  `);
}

function submitJob(id) {
  const v = sel => document.getElementById(sel).value;
  const customerId = v("jf-cust") ? Number(v("jf-cust")) : null;
  const label = document.getElementById("jf-label") ? v("jf-label").trim() : "";
  if (!customerId && !label) { alert("Pick a customer or give the job a name."); return; }
  let status = v("jf-status");
  const date = v("jf-date");
  if (status === "new" && date) status = "scheduled";
  saveJob({
    id, customerId, label,
    type: v("jf-type"), status, date,
    slot: v("jf-slot"), tech: v("jf-tech").trim(),
    amount: Number(v("jf-amount")) || 0,
    notes: v("jf-notes").trim(),
  });
}

function openCustomerSheet(custId = null) {
  const c = custId ? state.customers.find(x => x.id === custId) : null;
  sheet(c ? "Edit customer" : "New customer", `
    <div class="field"><label class="f">Name</label>
      <input id="cf-name" class="input" placeholder="Full name or business" value="${esc(c?.name||"")}"></div>
    <div class="formgrid">
      <div class="field"><label class="f">Phone</label>
        <input id="cf-phone" type="tel" inputmode="tel" class="input" placeholder="(512) 555-0100" value="${esc(c?.phone||"")}"></div>
      <div class="field"><label class="f">Email</label>
        <input id="cf-email" type="email" inputmode="email" class="input" placeholder="name@email.com" value="${esc(c?.email||"")}"></div>
    </div>
    <div class="field"><label class="f">Address</label>
      <input id="cf-address" class="input" placeholder="Street, city, ZIP" value="${esc(c?.address||"")}"></div>
    <div class="field"><label class="f">Notes</label>
      <textarea id="cf-notes" class="input" rows="3" placeholder="Gate codes, pets, billing terms…">${esc(c?.notes||"")}</textarea></div>
    <div class="sheet-actions"><div class="right">
      <button class="btn-nav" onclick="closeSheet()">Cancel</button>
      <button class="btn-solid" onclick="submitCustomer(${c?.id ?? "null"})">${c ? "Save changes" : "Add customer"}</button>
    </div></div>
  `);
}

function submitCustomer(id) {
  const v = sel => document.getElementById(sel).value;
  const name = v("cf-name").trim();
  if (!name) { alert("Give the customer a name."); return; }
  saveCustomer({
    id, name,
    phone: v("cf-phone").trim(), email: v("cf-email").trim(),
    address: v("cf-address").trim(), notes: v("cf-notes").trim(),
  });
}

/* ---------- small handlers ---------- */
function go(view) { state.view = view; state.search = ""; render(); }
function shiftWeek(n) { state.weekStart = addDays(state.weekStart, n); render(); }
function goToday() { state.weekStart = startOfWeek(today()); render(); }
function setFilter(s) { state.jobFilter = s; render(); }
function selectCustomer(id) { state.selectedCustomerId = state.selectedCustomerId === id ? null : id; render(); }
function setSearch(val) {
  state.search = val;
  // Re-render only the list content, keeping the input focused
  const active = document.activeElement;
  const pos = active && active.selectionStart;
  render();
  const input = document.querySelector(".search");
  if (input) { input.focus(); try { input.setSelectionRange(pos, pos); } catch(e){} }
}

render();
</script>
</body>
